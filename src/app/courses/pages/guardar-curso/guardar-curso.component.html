<mat-card style="margin: 20px; max-width: 600px;">
  <mat-card-header>
    <mat-card-title>{{ esEdicion ? 'Editar Curso' : 'Crear Curso' }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="cursoForm" (ngSubmit)="guardar()">
      <mat-form-field appearance="outline" style="width: 100%; margin-top: 20px;">
        <mat-label>Titulo</mat-label>
        <input matInput formControlName="title" placeholder="Titulo del curso">
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>Descripcion</mat-label>
        <textarea matInput formControlName="description" placeholder="Descripcion del curso" rows="4"></textarea>
      </mat-form-field>

      <mat-card-actions>
        <button style="margin-right: 10px;" mat-raised-button color="primary" type="submit" [disabled]="cursoForm.invalid">
          {{ esEdicion ? 'Actualizar' : 'Crear' }}
        </button>
        <button mat-button type="button" (click)="cancelar()">Cancelar</button>
      </mat-card-actions>
    </form>
  </mat-card-content>
</mat-card>
