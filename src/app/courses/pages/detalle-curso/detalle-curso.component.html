<div>
    <div style="margin: 20px;">
        <button mat-raised-button color="primary" (click)="crearLeccion()">Crear Lección</button>
    </div>

    @for (leccion of lecciones; track leccion.id) {
        <mat-card style="margin: 20px;">
            <mat-card-header>
                <mat-card-title>{{leccion.title}}</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <p>
                    {{leccion.description}}
                </p>
            </mat-card-content>
            <mat-card-actions>
                <button mat-button (click)="verLeccion(leccion.id)">Ver lección</button>
                <button mat-button (click)="editarLeccion(leccion.id)">Editar</button>
                <button mat-button color="warn" (click)="eliminarLeccion(leccion.id)">Eliminar</button>
            </mat-card-actions>
        </mat-card>
    }
</div>
