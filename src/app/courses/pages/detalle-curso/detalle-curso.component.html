<div>
    @for (leccion of lecciones; track leccion.id) {
        <mat-card style="margin: 20px;">
            <mat-card-header>
                <mat-card-title>{{leccion.title}}</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <p>
                    {{leccion.description}}
                </p>
            </mat-card-content>
            <mat-card-actions>
                <button mat-button [routerLink]="['/cursos', idCurso, 'leccion', leccion.id]">Ver leccion</button>
            </mat-card-actions>
        </mat-card>
    }
</div>
