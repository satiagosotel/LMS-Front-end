<div>
    <div style="margin: 20px;">
        <button mat-raised-button color="primary" (click)="crearCurso()">Crear Curso</button>
    </div>

    @for (curso of cursos; track curso.id) {
        <mat-card style="margin: 20px;">
            <mat-card-header>
                <mat-card-title>{{curso.title}}</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <p>
                    {{curso.description}}
                </p>
            </mat-card-content>
            <mat-card-actions>
                <button mat-button (click)="irCurso(curso.id)">Ver curso</button>
                <button mat-button (click)="editarCurso(curso.id)">Editar</button>
                <button mat-button color="warn" (click)="eliminarCurso(curso.id)">Eliminar</button>
            </mat-card-actions>
        </mat-card>
    }
</div>
