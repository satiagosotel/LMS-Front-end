<mat-card style="margin: 20px; max-width: 600px;">
  <mat-card-header>
    <mat-card-title>{{ esEdicion ? 'Editar Lección' : 'Crear Lección' }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="leccionForm" (ngSubmit)="guardar()">
      <mat-form-field appearance="outline" style="width: 100%; margin-top: 20px;">
        <mat-label>Título</mat-label>
        <input matInput formControlName="title" placeholder="Título de la lección">
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>Descripción</mat-label>
        <textarea matInput formControlName="description" placeholder="Descripción de la lección" rows="4"></textarea>
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>Orden</mat-label>
        <input matInput type="number" formControlName="orderIndex" placeholder="Orden de la lección">
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>URL de YouTube</mat-label>
        <input matInput formControlName="youtubeUrl" placeholder="https://youtube.com/watch?v=...">
        @if (leccionForm.get('youtubeUrl')?.hasError('pattern')) {
          <mat-error>Ingrese una URL de YouTube válida</mat-error>
        }
      </mat-form-field>

      <mat-card-actions>
        <button mat-raised-button color="primary" type="submit" [disabled]="leccionForm.invalid">
          {{ esEdicion ? 'Actualizar' : 'Crear' }}
        </button>
        <button mat-button type="button" (click)="cancelar()">Cancelar</button>
      </mat-card-actions>
    </form>
  </mat-card-content>
</mat-card>
