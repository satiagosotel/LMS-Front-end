<mat-card style="margin: 20px; max-width: 600px;">
  <mat-card-header>
    <mat-card-title>{{ esEdicion ? 'Editar Usuario' : 'Crear Usuario' }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="userForm" (ngSubmit)="guardar()">
      <mat-form-field appearance="outline" style="width: 100%; margin-top: 20px;">
        <mat-label>Usuario</mat-label>
        <input matInput formControlName="username" placeholder="Nombre de usuario">
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" placeholder="Correo electronico" type="email">
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" placeholder="Contrasena" type="password">
        @if (esEdicion) {
          <mat-hint>Dejar vacio para mantener la contrasena actual</mat-hint>
        }
      </mat-form-field>

      <div class="roles-container">
        <label class="roles-label">Roles</label>
        <div class="roles-group">
          @for (rol of roles; track rol.value) {
            <mat-checkbox
              [checked]="isRolSeleccionado(rol.value)"
              (change)="toggleRol(rol.value)">
              {{ rol.label }}
            </mat-checkbox>
          }
        </div>
      </div>

      <mat-card-actions>
        <button mat-raised-button color="primary" type="submit" [disabled]="userForm.invalid || rolesSeleccionados.length === 0">
          {{ esEdicion ? 'Actualizar' : 'Crear' }}
        </button>
        <button mat-button type="button" (click)="cancelar()">Cancelar</button>
      </mat-card-actions>
    </form>
  </mat-card-content>
</mat-card>
